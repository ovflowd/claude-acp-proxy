version: 2
updates:
  - package-ecosystem: npm
    directory: /adapter
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The "Update the adapter" workflow opens the pull request for this one.
      - dependency-name: "@agentclientprotocol/claude-agent-acp"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
