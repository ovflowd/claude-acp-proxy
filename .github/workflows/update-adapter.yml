name: Update the adapter

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-adapter
  cancel-in-progress: false

jobs:
  update:
    name: Open a pull request for a new adapter version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job holds a write token, so it never runs the new release: it only changes the pin and the lockfile.
    # The tests and the enableRemoteControl check run in CI on the pull request's branch, with a read-only token.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: "@agentclientprotocol/claude-agent-acp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Look for a newer release
        id: version
        shell: bash
        run: |
          latest=$(npm view "$PACKAGE" version --registry=https://registry.npmjs.org/)
          current=$(node -p "require('./package.json').dependencies[process.env.PACKAGE]")
          echo "latest $latest, pinned $current"
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest version is not a release: $latest"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Skip a version that has a pull request already
        id: existing
        if: steps.version.outputs.update == 'true'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          found=$(gh pr list --head "automation/adapter-$LATEST" --state all --json number --jq length)
          if [ "$found" != "0" ]; then
            echo "A pull request for $LATEST exists already, open or closed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # --package-lock-only resolves the new versions from the registry's metadata and installs nothing, so no code
      # from the release runs here.
      - name: Update the pin and the lockfile
        id: lockfile
        if: steps.version.outputs.update == 'true' && steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          sdk="node_modules/@anthropic-ai/claude-agent-sdk"
          old_sdk=$(node -p "require('./package-lock.json').packages['$sdk'].version")
          npm install --package-lock-only --ignore-scripts --save-exact "$PACKAGE@$LATEST" \
            --registry=https://registry.npmjs.org/
          new_sdk=$(node -p "require('./package-lock.json').packages['$sdk'].version")
          echo "old_sdk=$old_sdk" >> "$GITHUB_OUTPUT"
          echo "new_sdk=$new_sdk" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.lockfile.outcome == 'success'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          CURRENT: ${{ steps.version.outputs.current }}
          OLD_SDK: ${{ steps.lockfile.outputs.old_sdk }}
          NEW_SDK: ${{ steps.lockfile.outputs.new_sdk }}
        run: |
          branch="automation/adapter-$LATEST"
          title="chore(deps): bump the adapter from $CURRENT to $LATEST"
          upstream="https://github.com/agentclientprotocol/claude-agent-acp"
          upgrading="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/upgrading.md#upgrading-the-adapter"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json package-lock.json
          git commit -m "$title" \
            -m "Claude Agent SDK $OLD_SDK to $NEW_SDK. Changes: $upstream/compare/v$CURRENT...v$LATEST"
          # The branch belongs to this workflow. One left by a run that failed before its pull request is replaced,
          # or every later run would stop here.
          gh auth setup-git
          git push --force origin "$branch"

          # GitHub renders a single newline in a pull request body as a line break: one line per paragraph.
          cat > "$RUNNER_TEMP/body.md" <<BODY
          Bumps \`$PACKAGE\` from $CURRENT to $LATEST, and the Claude Agent SDK it installs from $OLD_SDK to $NEW_SDK.

          - [Changes between the two versions]($upstream/compare/v$CURRENT...v$LATEST)
          - [Changelog]($upstream/blob/main/CHANGELOG.md)

          CI runs the tests and checks that the SDK still has \`enableRemoteControl\` on this branch, on Linux and macOS. This workflow did not run the new release.

          Before merging, check in the editor ([docs/upgrading.md]($upgrading)):

          - [ ] A thread in a repository with a \`CLAUDE.md\` keeps it out of context.
          - [ ] A compacted thread's history starts before its summary.
          - [ ] A thread changed to another model and effort comes back as it was.
          - [ ] Stop and "Send Now" still behave, if steering is on.

          This pull request was opened by the *Update the adapter* workflow.
          BODY
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"

          for number in $(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/adapter-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$number" --delete-branch --comment "Superseded by the bump to $LATEST."
          done
          # A pull request opened with the workflow's token does not start CI by itself.
          gh workflow run ci.yml --ref "$branch"
