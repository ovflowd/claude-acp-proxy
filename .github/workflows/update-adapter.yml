name: Update the adapter

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-adapter
  cancel-in-progress: false

jobs:
  update:
    name: Open a pull request for a new adapter version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: "@agentclientprotocol/claude-agent-acp"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Look for a newer release
        id: version
        shell: bash
        run: |
          latest=$(npm view "$PACKAGE" version --registry=https://registry.npmjs.org/)
          current=$(node -p "require('./adapter/package.json').dependencies[process.env.PACKAGE]")
          echo "latest $latest, pinned $current"
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest version is not a release: $latest"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Skip a version that has a pull request already
        id: existing
        if: steps.version.outputs.update == 'true'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          found=$(gh pr list --head "automation/adapter-$LATEST" --state all --json number --jq length)
          if [ "$found" != "0" ]; then
            echo "A pull request for $LATEST exists already, open or closed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the new version
        id: install
        if: steps.version.outputs.update == 'true' && steps.existing.outputs.skip != 'true'
        shell: bash
        working-directory: adapter
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          old_sdk=$(node -p "require('./package-lock.json').packages['node_modules/@anthropic-ai/claude-agent-sdk'].version")
          npm install --save-exact "$PACKAGE@$LATEST" --registry=https://registry.npmjs.org/
          new_sdk=$(node -p "require('./node_modules/@anthropic-ai/claude-agent-sdk/package.json').version")
          echo "old_sdk=$old_sdk" >> "$GITHUB_OUTPUT"
          echo "new_sdk=$new_sdk" >> "$GITHUB_OUTPUT"

      - name: Check that the SDK still has enableRemoteControl
        if: steps.install.outcome == 'success'
        shell: bash
        run: grep -q enableRemoteControl adapter/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs

      - name: Test
        if: steps.install.outcome == 'success'
        run: npm test

      - name: Open the pull request
        if: steps.install.outcome == 'success'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          CURRENT: ${{ steps.version.outputs.current }}
          OLD_SDK: ${{ steps.install.outputs.old_sdk }}
          NEW_SDK: ${{ steps.install.outputs.new_sdk }}
        run: |
          branch="automation/adapter-$LATEST"
          upstream="https://github.com/agentclientprotocol/claude-agent-acp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add adapter/package.json adapter/package-lock.json
          git commit -m "chore(deps): bump the adapter to $LATEST" \
            -m "Claude Agent SDK $OLD_SDK to $NEW_SDK. Changes: $upstream/compare/v$CURRENT...v$LATEST"
          git push origin "$branch"

          cat > body.md <<BODY
          Bumps \`$PACKAGE\` from $CURRENT to $LATEST, and the Claude Agent SDK it
          installs from $OLD_SDK to $NEW_SDK.

          - [Changes between the two versions]($upstream/compare/v$CURRENT...v$LATEST)
          - [Changelog]($upstream/blob/main/CHANGELOG.md)

          The workflow ran the tests on Linux and checked that the SDK still has
          \`enableRemoteControl\`. The CI workflow runs on this branch too, on Linux and
          macOS.

          Before merging, check in the editor (see the README, *Upgrading the adapter*):

          - [ ] A thread in a repository with a \`CLAUDE.md\` keeps it out of context.
          - [ ] A compacted thread's history starts before its summary.
          - [ ] A thread changed to another model and effort comes back as it was.
          - [ ] Stop and "Send Now" still behave, if steering is on.

          This pull request was opened by the *Update the adapter* workflow.
          BODY
          gh pr create --base main --head "$branch" \
            --title "chore(deps): Bump the adapter from $CURRENT to $LATEST" \
            --body-file body.md

          for number in $(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"automation/adapter-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$number" --delete-branch --comment "Superseded by the bump to $LATEST."
          done
          gh workflow run ci.yml --ref "$branch"
